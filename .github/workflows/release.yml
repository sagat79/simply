# Tags and releases the theme automatically whenever package.json's version
# doesn't already have a matching git tag (matching this repo's existing tag
# convention, e.g. v2025.6.0 — all prior tags were cut from dev, not master).
# Checks tag existence rather than diffing against the immediate parent
# commit: a HEAD~1 diff misses version bumps whenever more than one push
# lands on dev between workflow runs (e.g. a PR merge immediately followed
# by an auto-merged Renovate PR) — v3.0.0 was silently skipped this way the
# first time this workflow ran against a real multi-push burst.
#
# The `push` trigger alone wasn't firing either, for an unrelated reason
# that's now fixed at the source: GitHub Actions never fires downstream
# push-triggered workflows for a push made by the default GITHUB_TOKEN
# (documented, intentional, prevents recursive workflow runs), and
# auto-merge.yml used to merge PRs with that same token. auto-merge.yml now
# merges with a PAT (secrets.AUTOMERGE_PAT) instead, which doesn't carry
# that restriction — so push-triggered workflows fire normally again.
#
# Sequenced after "Deploy Dev Theme" (workflow_run) rather than triggered
# directly on push: running release and deploy in parallel off the same
# push meant a release could get tagged even if the live-site deploy
# failed. Chaining on deploy's completion (success only) guarantees a
# release always reflects a theme that's actually live.
name: Release

on:
  workflow_run:
    workflows: [Deploy Dev Theme]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Check whether the theme version has already been released
        id: check
        run: |
          current=$(jq -r .version package.json)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$current" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Build theme zip
        if: steps.check.outputs.changed == 'true'
        run: npm run prod

      - name: Tag and publish release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.check.outputs.version }}"
          gh release create "$tag" dist/*.zip \
            --title "$tag" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --generate-notes
